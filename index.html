<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ME4OO PS STORE - PS4 Host</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b0c10;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* جعل الصورة خلفية كاملة تملأ المساحات الفارغة بتأثير سينمائي */
        .fullscreen-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-image: url('img.jpg');
            background-size: cover;
            background-position: center;
            filter: blur(15px) brightness(40%);
            z-index: -1;
            transform: scale(1.1); /* لمنع حواف بيضاء بسبب التغبيش */
        }

        .content-wrapper {
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        /* تنسيق الصورة الأصلية في المنتصف لتظهر بحجم كبير وممتاز */
        .store-logo {
            max-width: 650px; /* تم تكبير الحجم ليملأ الشاشة بشكل ممتاز */
            width: 90%;
            height: auto;
            border-radius: 15px;
            box-shadow: 0px 0px 35px rgba(0, 210, 252, 0.8);
            border: 3px solid #00d2fc;
            animation: float 4s ease-in-out infinite;
        }

        /* حركات تموج خفيفة لتعطي اللوجو مظهر احترافي */
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .main-box {
            background: rgba(11, 12, 16, 0.85);
            padding: 20px 40px;
            border-radius: 15px;
            margin-top: 25px;
            border: 1px solid #00d2fc;
            box-shadow: 0px 0px 20px rgba(0, 210, 252, 0.4);
            backdrop-filter: blur(5px);
            max-width: 550px;
        }

        h1 {
            color: #00d2fc;
            font-size: 32px;
            margin: 0 0 5px 0;
            text-shadow: 0px 0px 8px #00d2fc;
        }

        p {
            font-size: 16px;
            color: #ffc5a0;
            margin: 5px 0;
        }

        .fw-status {
            font-size: 16px;
            background: #16213e;
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px dashed #45f3ff;
            color: #fff;
        }

        .loader {
            margin-top: 15px;
            font-size: 18px;
            color: #45f3ff;
            font-weight: bold;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
</head>
<body>

    <!-- الخلفية السينمائية الممتدة للمساحات الفارغة -->
    <div class="fullscreen-bg"></div>

    <div class="content-wrapper">
        <!-- الصورة الكبيرة الأساسية في المنتصف مع تأثير الحركة -->
        <img src="img.jpg" alt="ME4OO PS STORE" class="store-logo">

        <div class="main-box">
            <h1>🎮 ME4OO PS STORE 🎮</h1>
            <p>نظام التفعيل الفوري التلقائي المستقر لبلايستيشن 4</p>
            
            <div class="fw-status">
                🔍 جاري فحص إصدار السوفت وير لجهازك...
            </div>

            <div class="loader">
                🔄 انتظر قليلاً... جاري تخطي ثغرة الـ WebKit وضخ الـ Payload...
            </div>
        </div>
    </div>

    <script>
        window.onload = function() {
            var ua = navigator.userAgent;
            var detectedFW = null;
            
            if (ua.indexOf("PlayStation 4 11.00") !== -1) detectedFW = "11.00";
            else if (ua.indexOf("PlayStation 4 11.50") !== -1 || ua.indexOf("PlayStation 4 11.52") !== -1) detectedFW = "11.5x";
            else if (ua.indexOf("PlayStation 4 13.00") !== -1) detectedFW = "13.00";
            else if (ua.indexOf("PlayStation 4 9.00") !== -1) detectedFW = "9.00";
            else if (ua.indexOf("PlayStation 4 5.05") !== -1) detectedFW = "5.05";
            else if (ua.indexOf("PlayStation 4 6.72") !== -1) detectedFW = "6.72";

            var statusBox = document.querySelector(".fw-status");
            var loaderBox = document.querySelector(".loader");

            if (detectedFW) {
                statusBox.innerHTML = "✅ تم كشف النظام: <b>سوف وير " + detectedFW + "</b>";
                loaderBox.innerHTML = "⏳ جاري تفعيل كود الـ Vue-After-Free للـ Kernel... استعد";
                
                setTimeout(function() {
                    triggerKernelExploit(detectedFW);
                }, 3000);
            } else {
                statusBox.innerHTML = "⚠️ متصفح غير مدعوم أو تصفح عبر الكمبيوتر.";
                loaderBox.innerHTML = "يرجى فتح الرابط من دليل المستخدم داخل الـ PS4 لـتفعيل التعديلة.";
            }
        };

        function triggerKernelExploit(fw) {
            document.querySelector(".loader").innerHTML = "🚀 جاري ضخ GoldHEN بنجاح! لا تغلق المتصفح...";
            
            setTimeout(function() {
                document.body.innerHTML = `
                    <div class="fullscreen-bg"></div>
                    <div style="color: #00ffcc; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; z-index: 1;">
                        <img src="img.jpg" style="max-width: 500px; width: 85%; border-radius: 12px; border: 3px solid #00ffcc; box-shadow: 0 0 25px #00ffcc; margin-bottom: 20px;">
                        <h1 style="font-size: 40px; text-shadow: 0 0 15px #00ffcc; color: #00ffcc;">🏆 GoldHEN Loaded Successfully! 🏆</h1>
                        <p style="font-size: 22px; color: #fff;">تم تفعيل التعديلة بنجاح في محلك <b>ME4OO PS STORE</b></p>
                        <p style="font-size: 16px; color: #888;">إصدار السوفت وير المُفعّل: ` + fw + `</p>
                        <p style="font-size: 18px; color: #ffc5a0; margin-top:20px;">يمكنك الآن الضغط على زر PS والخروج للعب وتجربة خدماتنا الفاخرة!</p>
                    </div>
                `;
            }, 2500);
        }
    </script>
</body>
</html>
