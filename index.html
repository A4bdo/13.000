<!DOCTYPE html>
<html lang="ar" manifest="cache.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ME4OO PS STORE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060b;color:#eef6ff;font-family:"Segoe UI",Arial,sans-serif}
body:before{content:"";position:fixed;inset:0;background:
radial-gradient(circle at 50% 35%,rgba(0,126,255,.16),transparent 36%),
linear-gradient(145deg,#020409 0%,#071426 52%,#02050a 100%);z-index:-2}
body:after{content:"";position:fixed;inset:0;background-image:
linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
background-size:42px 42px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.65),transparent 80%);z-index:-1}
.shell{height:100%;display:flex;align-items:center;justify-content:center;padding:28px}
.card{width:min(760px,92vw);text-align:center;margin: 0 auto;}

/* تصميم مربع اللوجو المخصص لعرض صورتك الفخمة store_logo.png بحجم كبير ومتناسق في المنتصف */
.mark{width:220px;height:220px;margin:0 auto 15px;border:1px solid rgba(72,164,255,.38);border-radius:22px;
display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,rgba(12,34,59,.92),rgba(3,10,19,.94));
box-shadow:0 20px 70px rgba(0,94,255,.16),inset 0 0 30px rgba(53,151,255,.06)}
.brand-logo{display:block;width:100%;height:100%;object-fit:cover;border-radius:20px}

/* اسم المحل باللون الأبيض المتوهج والفخم كلياً */
.brand{font-size:28px;font-weight:800;letter-spacing:.05em;color:#fff;text-shadow:0 0 15px rgba(255,255,255,0.3);margin-top: 15px;margin-bottom: 5px;}
.sub{margin-top:5px;color:#7390ad;font-size:12px;letter-spacing:.32em;text-transform:uppercase;margin-bottom: 5px;}
.stage{margin:25px auto 0;max-width:560px}
#state{font-size:19px;font-weight:650;letter-spacing:.03em;margin-bottom:8px}
#det{font-size:12px;color:#71869d;min-height:18px}
#det b{color:#b9d9f7;font-weight:600}
.progress{height:5px;margin:18px 0 12px;border-radius:99px;background:#101a26;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.025)}
#bar{width:4%;height:100%;border-radius:99px;background:linear-gradient(90deg,#168cff,#63c4ff);transition:width .28s ease;box-shadow:0 0 18px rgba(45,164,255,.7)}
.meta{display:flex;justify-content:space-between;align-items:center;color:#5f7185;font-size:11px;letter-spacing:.08em}
#cache.cacheok{color:#62d69a}
#pct{color:#9fc9ee;font-variant-numeric:tabular-nums}

/* الفوتر السفلي الأنيق باللون الداكن المخصص للمحل */
.footer{position:fixed;left:0;right:0;bottom:20px;text-align:center;color:#35475a;font-size:10px;letter-spacing:.22em}
.ok{color:#62d69a}.bad{color:#ef8d82}.warn{color:#e8c66f}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.48}}
</style>
</head>
<body>
<div class="shell">
  <main class="card">
    <div class="mark"><img src="store_logo.png" alt="ME4OO STORE" class="brand-logo"></div>
    <div class="brand">ME4OO PS STORE</div>
    <div class="sub">PS4 HOST</div>

    <section class="stage">
      <div id="state">Detecting firmware...</div>
      <div id="det"></div>
      <div class="progress"><div id="bar"></div></div>
      <div class="meta">
        <div id="cache">Preparing offline cache...</div>
        <div id="pct">0%</div>
      </div>
    </section>
  </main>
</div>

<div class="footer">ME4OO STORE CONSOLE • OFFLINE READY HOST</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var barEl = document.getElementById("bar");
    var pctEl = document.getElementById("pct");

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    function setProgress(n) {
        n = Math.max(0, Math.min(100, n || 0));
        barEl.style.width = n + "%";
        pctEl.textContent = Math.round(n) + "%";
    }

    var params = new URLSearchParams(location.search);
    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var bug = null, why = "";
    var forced = params.get("bug");
    
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "forced via ?bug=" + forced;
    } else if (!key) {
        why = "user-agent is not a PlayStation 4";
    } else if (fwnum === 505) {
        bug = "local_505"; why = "توجيه تلقائي لإصدار " + key;
    } else if (fwnum === 672) {
        bug = "local_672"; why = "توجيه تلقائي لإصدار " + key;
    } else if (fwnum === 702) {
        bug = "local_702"; why = "توجيه تلقائي لإصدار " + key;
    } else if (fwnum === 900) {
        bug = "local_900"; why = "توجيه تلقائي لإصدار " + key;
    } else if (fwnum > 900 && fwnum <= 1300) {
        // فحص تلقائي ذكي لسوفت 13.00 وتحويله للمجلد المحلي الشغال عندك بدلاً من أي روابط خارجية
        bug = "local_1300"; why = "توجيه تلقائي لإصدار " + key;
    } else {
        why = "إصدار النظام " + key + " غير مسجل بالفحص التلقائي";
    }

    detEl.innerHTML = "Firmware <b>" + (key || "unknown") + "</b>"
        + " &nbsp;•&nbsp; Mode <b>" + (bug || "none") + "</b>";

    if (!bug) {
        setProgress(0);
        setCache(why, false);
        setState("UNSUPPORTED FIRMWARE", "bad");
        return;
    }

    // ربط وتوجيه الأجهزة بالكامل إلى المجلدات والملفات المحلية الموجودة عندك في الفولدر أوفلاين
    var target = "";
    if (bug === "local_1300") {
        target = "g2all/index.html"; // توجيه جهاز الـ 13.00 لمجلد تعديلتك المحلي فوراً بدون أخطاء 404
    } else if (bug === "local_900") {
        target = "900goldhen/index.html"; 
    } else if (bug === "local_702") {
        target = "702/index.html";
    } else if (bug === "local_672") {
        target = "672goldhen/index.html";
    } else if (bug === "local_505") {
        target = "505goldhen/index.html";
    }

    function go() {
        setProgress(100);
        setCache("Offline cache ready", true);
        setState("Loading PS4 modification...", "warn pulse");
        setTimeout(function(){ location.replace(target); }, 650);
    }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        setProgress(100); go();
    } else if (!navigator.onLine) {
        setProgress(100); setCache("Offline • loaded from cache", true); go();
    } else if (ac.status === ac.IDLE) {
        setProgress(100); setCache("Offline cache ready", true); go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setProgress(100); setCache("Update downloaded", true);
        waitForTap("UPDATE READY • PRESS X TO RELOAD", function () { location.reload(); });
    } else {
        setState("Preparing offline cache...", "pulse");
        setCache("Downloading required files...");
        setProgress(2);

        ac.addEventListener("downloading", function () {
            setState("Preparing offline cache...", "pulse");
            setCache("Downloading required files...");
            setProgress(4);
        }, false);

        ac.addEventListener("progress", function (e) {
            if (e && e.total) {
                var p = Math.round((e.loaded / e.total) * 100);
                setProgress(p);
                setCache("Caching files for offline use...");
            }
        }, false);

        ac.addEventListener("cached", function () {
            setProgress(100);
            setCache("Offline cache ready", true);
            waitForTap("CACHE COMPLETE • PRESS X TO CONTINUE", go);
        }, false);

        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setProgress(100); setCache("Update downloaded", true);
            waitForTap("UPDATE READY • PRESS X TO RELOAD", function () { location.reload(); });
        }, false);

        ac.addEventListener("noupdate", function () {
            setProgress(100); setCache("Offline cache ready", true); go();
        }, false);

        ac.addEventListener("error", function () {
            setProgress(0);
            setCache("Offline cache could not be prepared");
            waitForTap("CACHE FAILED - PRESS X TO CONTINUE ONLINE", go);
        }, false);

        ac.addEventListener("obsolete", function () {
            setProgress(0);
            setCache("Saved cache is no longer available");
            waitForTap("CACHE RESET - PRESS X TO CONTINUE ONLINE", go);
        }, false);
    }
})();
</script>
</body>
</html>
